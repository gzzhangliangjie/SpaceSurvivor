name: Sync to Gitee

# 每次 push（所有分支、所有 tag）都同步，也支持在 Actions 页面手动触发
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        shell: bash
        env:
          # Actions 自带 token，可读本仓库（私有仓库也可以）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Syncing ${GITHUB_REPOSITORY} -> gitee.com/${GITEE_USER}/${REPO_NAME}"

          # 每次全新裸克隆，保证 Gitee 与 GitHub 完全一致（含删除的分支/tag）
          git clone --bare "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git

          # --mirror 会推送所有分支 + tag，并删除 Gitee 上多余的引用
          git push --mirror "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO_NAME}.git"
